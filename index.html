<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f4fd1">
<meta name="description" content="American English pronunciation trainer: 6000 words, 5 levels, 40 topics, scoring out of 100.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}</style>
<title>US Pronunciation Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=Gentium+Book+Plus:wght@400;700&display=swap">
<style>
/* Layout: sticky header + single working column; levels = grid of topic cards, practice = one large word card with score dial */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --surface-2:#e8ecf4; --fg:#141a2b; --muted:#5b6478; --line:#d3d9e6;
  --accent:#1f4fd1; --accent-ink:#ffffff; --accent-soft:#dfe7fb; --star:#c98a00;
  --g1:#0072B2; --g2:#56B4E9; --g3:#E69F00; --g4:#D55E00;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
  --ipa:"Gentium Book Plus", "Charis SIL", "Doulos SIL", "Times New Roman", serif;
  --radius:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1320; --surface:#171d2e; --surface-2:#20283d; --fg:#e9edf7; --muted:#9aa4bd; --line:#2c3550;
  --accent:#7ea2ff; --accent-ink:#0b1022; --accent-soft:#22305a; --star:#f2b632; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1320; --surface:#171d2e; --surface-2:#20283d; --fg:#e9edf7; --muted:#9aa4bd; --line:#2c3550;
  --accent:#7ea2ff; --accent-ink:#0b1022; --accent-soft:#22305a; --star:#f2b632; color-scheme:dark}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.5}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.hbar{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px;margin-right:auto}
.brand .ipa{font-family:var(--ipa);font-weight:400;color:var(--muted);font-size:15px}
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:999px}
.tab{border:0;background:transparent;padding:6px 14px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.langbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700}
.search{position:relative;margin:18px 0 8px}
.search input{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit}
.results{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.15);max-height:340px;overflow:auto;z-index:4}
.res{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;border:0;background:transparent;padding:9px 14px;border-bottom:1px solid var(--line)}
.res:hover{background:var(--surface-2)}
.res b{font-family:var(--display)}
.res .m{color:var(--muted);font-size:13px;margin-left:auto;white-space:nowrap}
h2{font-family:var(--display);font-weight:700;font-size:22px;margin:22px 0 10px;text-wrap:balance}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lvl{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.lvl .n{font-family:var(--display);font-weight:800;font-size:22px;line-height:1}
.lvl .d{font-size:13px;color:var(--muted)}
.lvl .bars{display:flex;gap:2px;margin-top:6px}
.lvl .bars i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.lvl .bars i.on{background:var(--accent)}
.lvl[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-top:14px}
.topic{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.topic:hover{border-color:var(--accent)}
.topic .tn{font-weight:700;line-height:1.25}
.topic .te{font-size:12px;color:var(--muted)}
.topic .sample{font-family:var(--ipa);font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.prog span{display:block;height:100%;background:var(--accent)}
.topic .st{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.crumb{display:flex;align-items:center;gap:10px;margin:18px 0 10px;flex-wrap:wrap}
.back{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:700}
.crumb .t{font-family:var(--display);font-weight:700;font-size:18px}
.crumb .badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--fg)}
.practice{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;min-width:0;position:relative}
.word{font-family:var(--display);font-weight:800;font-size:clamp(34px,7vw,60px);line-height:1.05;letter-spacing:-.02em;overflow-wrap:anywhere;padding-right:46px}
.ipa-line{font-family:var(--ipa);font-size:22px;color:var(--muted);margin-top:6px}
.trans{margin-top:12px;font-size:19px;font-weight:700}
.trans small{display:block;font-size:12px;font-weight:400;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.favbtn{position:absolute;top:16px;right:16px;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.favbtn svg{width:22px;height:22px}
.favbtn[aria-pressed="true"] svg{fill:var(--star);stroke:var(--star)}
.favbtn svg{fill:none;stroke:var(--muted);stroke-width:2}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px 16px;font-weight:700;display:inline-flex;align-items:center;gap:8px}
.btn svg{width:18px;height:18px;fill:currentColor}
.btn.mic{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);padding:12px 22px;font-size:16px}
.btn.mic.rec{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px var(--accent-soft)}}
@media (prefers-reduced-motion:reduce){.btn.mic.rec{animation:none;outline:3px solid var(--accent-soft)}}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.msg{margin-top:14px;font-size:14px;color:var(--muted);min-height:1.5em}
.msg.err{color:var(--fg);background:var(--surface-2);border-left:4px solid var(--g4);padding:8px 12px;border-radius:8px}
.scorebox{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.dial{width:170px;height:170px}
.dial .track{stroke:var(--surface-2)}
.dial text{fill:var(--fg);font-family:var(--display);font-weight:800}
.grade{font-weight:700;font-size:16px}
.heard{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.heard b{color:var(--fg)}
.bestline{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px;margin-top:14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 8px;text-align:left;display:flex;justify-content:space-between;gap:6px;align-items:center;min-width:0;font-size:13px}
.chip span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip[aria-current="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.sc{font-variant-numeric:tabular-nums;font-weight:700;font-size:12px;padding:1px 6px;border-radius:6px;color:#fff;flex:none}
.sc.b1{background:var(--g1)}.sc.b2{background:var(--g2);color:#0b1b2b}.sc.b3{background:var(--g3);color:#1d1400}.sc.b4{background:var(--g4)}
.sc.none{background:transparent;color:var(--muted);border:1px dashed var(--line)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.foot{font-size:12px;color:var(--muted);margin-top:16px}
.kbd{font-family:ui-monospace,monospace;font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px}
.favlist{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.favrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.favrow .fw{font-family:var(--display);font-weight:700;font-size:17px}
.favrow .fi{font-family:var(--ipa);color:var(--muted);font-size:14px;margin-left:6px}
.favrow .ft{font-size:13px;color:var(--muted)}
.favrow button.x{border:0;background:transparent;color:var(--muted);font-size:13px;text-decoration:underline}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:26px;text-align:center;color:var(--muted)}
.overlay{position:fixed;inset:0;background:rgba(10,14,28,.55);display:grid;place-items:center;z-index:20;padding:16px}
.dlg{background:var(--surface);border-radius:20px;padding:26px;max-width:460px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.dlg h3{font-family:var(--display);font-size:24px;margin:0 0 4px;line-height:1.2}
.dlg p{margin:0 0 16px;color:var(--muted);font-size:14px}
.langs{display:grid;gap:8px}
.langs button{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 16px;font-weight:700;font-size:16px}
.langs button span{font-weight:400;color:var(--muted);font-size:13px}
.langs button:hover{border-color:var(--accent)}
.speed{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.speed input{width:90px}
@media (max-width:760px){
  .practice{grid-template-columns:1fr}
  .levels{grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
  .lvl{padding:8px}.lvl .d{font-size:11px;line-height:1.2}
  .brand .ipa{display:none}
  .speed span{display:none}.speed input{width:70px}
  .hbar{gap:8px}.tab{padding:6px 10px}
}
</style>
</head>
<body>

<header><div class="hbar">
  <div class="brand">US Pronunciation Lab <span class="ipa">/ˌɑɹ.tɪˈkjuː.lət/</span></div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tabLevels" aria-selected="true"></button>
    <button class="tab" role="tab" id="tabFavs" aria-selected="false"></button>
  </div>
  <label class="speed"><span id="speedLbl"></span><input type="range" id="rate" min="0.5" max="1.2" step="0.05" value="0.9"></label>
  <button class="langbtn" id="langBtn"></button>
</div></header>

<main class="wrap">
  <div class="search">
    <input id="q" type="search" autocomplete="off">
    <div class="results" id="results" hidden></div>
  </div>
  <section id="viewLevels"></section>
  <section id="viewPractice" hidden></section>
  <section id="viewFavs" hidden></section>
</main>

<footer class="wrap" style="padding-block:0 28px;font-size:12px;color:var(--muted)">
  <a href="privacy.html" style="color:inherit">Gizlilik / Privacy</a> · v1.0
</footer>
<div class="overlay" id="langDlg" hidden>
  <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgT">
    <h3 id="dlgT">Ana diliniz hangisi?</h3>
    <p id="dlgP">What is your native language?</p>
    <div class="langs" id="langList"></div>
  </div>
</div>

// ---------- speech synthesis (American English) ----------
let voice = null;
function pickVoice(){
  if(!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices().filter(v => /en[-_]US/i.test(v.lang));
  const pref = [/Google US English/i, /Samantha/i, /Aria/i, /Jenny/i, /Ava/i, /Allison/i, /Natural/i, /Microsoft (Zira|David|Mark)/i];
  for(const p of pref){ const v = vs.find(v => p.test(v.name)); if(v){ voice=v; return; } }
  voice = vs[0] || null;
}
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(word, slow){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(word);
  u.lang = 'en-US'; if(voice) u.voice = voice;
  const r = parseFloat($('#rate').value) || 0.9;
  u.rate = slow ? Math.max(0.45, r*0.6) : r;
  speechSynthesis.speak(u);
}

// ---------- scoring ----------
const SMALL = ["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
const TENS = ["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
function numWords(n){
  if(n<20) return SMALL[n];
  if(n<100) return TENS[Math.floor(n/10)] + (n%10? SMALL[n%10]:'');
  if(n<1000) return SMALL[Math.floor(n/100)]+'hundred'+(n%100? numWords(n%100):'');
  if(n<1000000) return numWords(Math.floor(n/1000))+'thousand'+(n%1000? numWords(n%1000):'');
  return String(n);
}
const ORD = {"1st":"first","2nd":"second","3rd":"third","4th":"fourth","5th":"fifth","6th":"sixth","7th":"seventh","8th":"eighth","9th":"ninth","10th":"tenth","12th":"twelfth","20th":"twentieth","100th":"hundredth"};
function norm(s){
  return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/\b\d+(st|nd|rd|th)\b/g, m => ORD[m] || m)
    .replace(/%/g,' percent ').replace(/&/g,' and ')
    .replace(/\d[\d,]*/g, m => { const n = parseInt(m.replace(/,/g,''),10); return isNaN(n)? m : ' '+numWords(n)+' '; })
    .replace(/[^a-z\s]/g,'').replace(/\s+/g,' ').trim();
}
function phon(s){ // simplified English phonetic key
  let w = s.replace(/[^a-z]/g,'');
  if(!w) return '';
  w = w.replace(/^(kn|gn|pn|wr|ps)/, m => m[1]).replace(/^x/,'s').replace(/^wh/,'w')
       .replace(/mb$/,'m').replace(/tch/g,'x').replace(/sch/g,'sk').replace(/ch/g,'x').replace(/sh/g,'x')
       .replace(/th/g,'0').replace(/ph/g,'f').replace(/gh(?![aeiou])/g,'').replace(/dg/g,'j')
       .replace(/ck/g,'k').replace(/qu/g,'kw').replace(/q/g,'k').replace(/x/g,m=>m) // keep x (sh)
       .replace(/c(?=[eiy])/g,'s').replace(/c/g,'k').replace(/g(?=[eiy])/g,'j').replace(/z/g,'s').replace(/v/g,'f')
       .replace(/ti(?=[ao])/g,'x').replace(/si(?=[ao])/g,'x');
  const first = w[0];
  let rest = w.slice(1).replace(/[aeiouy]/g,'').replace(/w(?![aeiou])/g,'').replace(/h/g,'');
  let key = (/[aeiouy]/.test(first)?'A':first) + rest;
  return key.replace(/(.)\1+/g,'$1');
}
function lev(a,b){
  if(a===b) return 0; if(!a.length) return b.length; if(!b.length) return a.length;
  let prev = Array.from({length:b.length+1},(_,i)=>i);
  for(let i=1;i<=a.length;i++){ const cur=[i]; for(let j=1;j<=b.length;j++){ cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1)); } prev=cur; }
  return prev[b.length];
}
const sim = (a,b) => { const m = Math.max(a.length,b.length); return m? 1 - lev(a,b)/m : 1; };
function scoreAttempt(target, alts){
  const tgt = norm(target).replace(/ /g,'');
  const tk = phon(tgt);
  let bestS = 0, bestHeard = alts[0] ? alts[0].t : '';
  alts.forEach((a, rank) => {
    const n = norm(a.t);
    const cands = new Set([n.replace(/ /g,'')]);
    const toks = n.split(' ').filter(Boolean);
    toks.forEach(x => cands.add(x));
    for(let i=0;i<toks.length-1;i++) cands.add(toks[i]+toks[i+1]);
    for(const c of cands){
      if(!c) continue;
      const extra = (toks.length>1 && c!==n.replace(/ /g,'')) ? 4 : 0;   // other words were heard too
      let s;
      if(c === tgt){
        const conf = a.c > 0 ? a.c : 0.85;
        s = 86 + 14*Math.min(1, conf);
      } else {
        const cs = sim(c, tgt), ps = sim(phon(c), tk);
        s = 100*(0.6*cs + 0.4*ps) * 0.86;                    // close but not recognized as the target
        s = Math.min(s, 80);
      }
      s = s - rank*5 - extra;
      if(s > bestS){ bestS = s; bestHeard = a.t; }
    }
  });
  return { score: Math.max(0, Math.min(100, Math.round(bestS))), heard: bestHeard };
}

// ---------- speech recognition ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, recording = false;
function listen(onDone, onErr){
  if(!SR){ onErr('unsupported'); return; }
  if(recording){ try{ rec.stop(); }catch(e){} return; }
  rec = new SR();
  rec.lang = 'en-US'; rec.interimResults = false; rec.maxAlternatives = 10; rec.continuous = false;
  let got = false;
  rec.onresult = e => {
    got = true;
    const r = e.results[0]; const alts = [];
    for(let i=0;i<r.length;i++) alts.push({t:r[i].transcript, c:r[i].confidence});
    onDone(alts);
  };
  rec.onerror = e => { got = true; onErr(e.error); };
  rec.onend = () => { recording = false; setMic(false); if(!got) onErr('no-speech'); };
  try{ if('speechSynthesis' in window) speechSynthesis.cancel(); rec.start(); recording = true; setMic(true); }
  catch(e){ recording=false; setMic(false); onErr('start'); }
}
function setMic(on){ const b = $('#micBtn'); if(!b) return; b.classList.toggle('rec', on); b.querySelector('.lbl').textContent = on ? '■ ' + T().speak : T().speak; }

// ---------- views ----------
function renderLevels(){
  const t = T(), v = $('#viewLevels'); v.replaceChildren();
  const lv = el('div',{class:'levels'});
  for(let l=1;l<=5;l++){
    const b = el('button',{class:'lvl','aria-pressed':String(l===curLevel), onclick:()=>{ curLevel=l; store.set('level',l); renderLevels(); }},
      el('span',{class:'n'}, String(l)), el('span',{class:'d'}, t.lv[l-1]),
      el('span',{class:'bars'}, [1,2,3,4,5].map(k=>el('i',{class:k<=l?'on':''}))));
    lv.append(b);
  }
  v.append(el('h2',{}, t.level+' '+curLevel+' · '+t.lv[curLevel-1]), lv);
  const grid = el('div',{class:'topics'});
  for(let ti=0; ti<40; ti++){
    let done=0, sum=0;
    for(let k=0;k<30;k++){ const s=best[idxOf(curLevel,ti,k)]; if(s!=null){done++; sum+=s;} }
    const sample = [0,1,2].map(k=>RAW[idxOf(curLevel,ti,k)][0]).join(' · ');
    grid.append(el('button',{class:'topic', onclick:()=>openTopic(curLevel,ti)},
      el('span',{class:'tn'}, topicName(ti)),
      lang!=='en' ? el('span',{class:'te'}, TOPICS[ti][0]) : null,
      el('span',{class:'sample'}, sample+' …'),
      el('span',{class:'prog'}, el('span',{style:'width:'+(done/30*100)+'%'})),
      el('span',{class:'st'}, el('span',{}, done+'/30 '+t.practiced), el('span',{}, done? t.avg+' '+Math.round(sum/done) : ''))));
  }
  v.append(grid);
}
function openTopic(l, ti){
  const list = Array.from({length:30},(_,k)=>idxOf(l,ti,k));
  session = {list, pos:0, title: topicName(ti), badge: T().level+' '+l, from:'Levels'};
  last = null; renderPractice(); show('Practice');
}
function openFavs(startIdx){
  const list = [...favs];
  if(!list.length) return;
  session = {list, pos: Math.max(0, list.indexOf(startIdx)), title: T().favs, badge: list.length+' '+T().count, from:'Favs'};
  last = null; renderPractice(); show('Practice');
}
function openSingle(i){
  const l = levelOf(i), ti = topicOf(i);
  const list = Array.from({length:30},(_,k)=>idxOf(l,ti,k));
  session = {list, pos:list.indexOf(i), title: topicName(ti), badge: T().level+' '+l, from:'Levels'};
  last = null; renderPractice(); show('Practice');
}

  const sc = el('div',{class:'card scorebox'},
    dial(last? last.score : null),
    el('div',{class:'grade'}, last? t.grades[band(last.score)-1] : ''),
    el('div',{class:'heard'}, last && last.heard ? [t.heard+': ', el('b',{lang:'en'}, '“'+last.heard+'”')] : ''),
    el('div',{class:'bestline'}, t.best+': '+(best[i]!=null? best[i]+' / 100' : '–')),
    el('div',{class:'legend'},
      [85,70,50,0].map((s,k)=>el('span',{}, el('span',{class:'sc b'+(k+1)}, k===3?'<50':s+'+'), t.grades[k])))
  );
  v.append(el('div',{class:'practice'}, card, sc));
  const strip = el('div',{class:'strip'});
  session.list.forEach((j,k)=>strip.append(el('button',{class:'chip','aria-current':String(k===session.pos), onclick:()=>{ session.pos=k; last=null; renderPractice(); }},
    el('span',{lang:'en'}, (favs.has(j)?'★ ':'')+RAW[j][0]), scoreChip(j))));
  v.append(strip);
  v.append(el('p',{class:'foot'}, t.note, ' ', t.keys+': ', el('span',{class:'kbd'},'L'),' '+t.keyListen+' · ', el('span',{class:'kbd'},'S'),' / ',el('span',{class:'kbd'},'Space'),' '+t.keySpeak+' · ', el('span',{class:'kbd'},'←'),el('span',{class:'kbd'},'→'),' '+t.keyNav));
}
function go(d){ const p = session.pos+d; if(p<0||p>=session.list.length) return; session.pos=p; last=null; renderPractice(); say(RAW[session.list[p]][0], false); }
function attempt(i){
  const t = T(), m = $('#msg');
  m.className='msg'; m.textContent = t.listening;
  listen(alts => {
    const res = scoreAttempt(RAW[i][0], alts);
    last = res;
    if(best[i]==null || res.score > best[i]){ best[i] = res.score; store.set('best', best); }
    renderPractice();
  }, err => {
    const mm = $('#msg'); if(!mm) return;
    if(err==='aborted') { mm.textContent=''; return; }
    mm.className='msg err';
    mm.textContent = err==='unsupported' ? t.unsupported
      : (err==='not-allowed'||err==='service-not-allowed'||err==='audio-capture') ? (window.self!==window.top ? t.embedded : t.micDenied)
      : err==='network' ? t.netErr : t.noSpeech;
  });
}
function toggleFav(i){
  if(favs.has(i)) favs.delete(i); else favs.add(i);
  store.set('favs',[...favs]); applyStatic();
  if(!$('#viewPractice').hidden) renderPractice();
  if(!$('#viewFavs').hidden) renderFavs();
}
function renderFavs(){
  const t = T(), v = $('#viewFavs'); v.replaceChildren();
  v.append(el('h2',{}, t.favs+' · '+favs.size+' '+t.count));
  if(!favs.size){ v.append(el('div',{class:'empty'}, t.noFavs)); return; }
  v.append(el('button',{class:'btn mic', onclick:()=>openFavs()}, svgFrom(ICON.mic), el('span',{class:'lbl'}, t.practiceFavs)));
  const list = el('div',{class:'favlist'});
  for(const i of favs){
    const r = RAW[i];
    list.append(el('div',{class:'favrow'},
      el('button',{style:'border:0;background:none;text-align:left;padding:0;min-width:0', onclick:()=>openFavs(i)},
        el('span',{class:'fw',lang:'en'}, r[0]), el('span',{class:'fi'}, '/'+r[1]+'/'),
        el('div',{class:'ft'}, r[L().col]+' · '+t.level+' '+levelOf(i)+' · '+topicName(topicOf(i)))),
      scoreChip(i),
      el('button',{class:'x', onclick:()=>toggleFav(i)}, t.remove)));
  }
  v.append(list);
}

// ---------- search ----------
const INDEX = RAW.map(r => r[0].toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''));
$('#q').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase(); const box = $('#results');
  if(q.length<2){ box.hidden=true; return; }
  const col = L().col, hits=[];
  for(let i=0;i<RAW.length && hits.length<40;i++){
    if(INDEX[i].startsWith(q)) hits.push(i);
  }
  for(let i=0;i<RAW.length && hits.length<40;i++){
    if(!hits.includes(i) && (INDEX[i].includes(q) || String(RAW[i][col]).toLowerCase().includes(q))) hits.push(i);
  }
  box.replaceChildren(...(hits.length? hits.map(i=>el('button',{class:'res', onclick:()=>{ box.hidden=true; e.target.value=''; openSingle(i); }},
      el('b',{lang:'en'}, RAW[i][0]), el('span',{}, RAW[i][col]), el('span',{class:'m'}, T().level+' '+levelOf(i)+' · '+topicName(topicOf(i)))))
    : [el('div',{class:'res'}, T().noRes)]));
  box.hidden=false;
});
document.addEventListener('click', e => { if(!e.target.closest('.search')) $('#results').hidden = true; });

// ---------- keyboard ----------
document.addEventListener('keydown', e => {
  if($('#viewPractice').hidden || !$('#langDlg').hidden) return;
  if(e.target.matches('input')) return;
  const i = session.list[session.pos];
  if(e.key==='ArrowRight') go(1);
  else if(e.key==='ArrowLeft') go(-1);
  else if(e.key==='l' || e.key==='L') say(RAW[i][0], false);
  else if(e.key==='s' || e.key==='S' || e.key===' '){ e.preventDefault(); attempt(i); }
});

// ---------- language dialog ----------
function openLangDlg(){
  const t = lang ? T() : null;
  $('#dlgT').textContent = t ? t.chooseT : 'Ana diliniz hangisi? · What is your native language?';
  $('#dlgP').textContent = t ? t.chooseP : 'Muttersprache · Lengua materna · Langue maternelle · 母语';
  const box = $('#langList'); box.replaceChildren();
  const hint = {tr:'Turkish',de:'German',es:'Spanish',fr:'French',zh:'Chinese'};
  LANGS.forEach(x => box.append(el('button',{onclick:()=>{ lang=x.k; store.set('lang',lang); $('#langDlg').hidden=true; refresh(); }}, x.name, el('span',{}, hint[x.k]))));
  $('#langDlg').hidden = false;
  box.querySelector('button').focus();
}
function refresh(){
  applyStatic();
  if(!$('#viewPractice').hidden && session){ if(session.from==='Favs') session.title=T().favs; else session.title=topicName(topicOf(session.list[0])); renderPractice(); }
  renderLevels(); renderFavs();
}
$('#langBtn').addEventListener('click', openLangDlg);
$('#tabLevels').addEventListener('click', ()=>{ renderLevels(); show('Levels'); });
$('#tabFavs').addEventListener('click', ()=>{ renderFavs(); show('Favs'); });
$('#rate').value = store.get('rate', 0.9);
$('#rate').addEventListener('change', e => store.set('rate', parseFloat(e.target.value)));

applyStatic(); renderLevels(); renderFavs();
if(!lang) openLangDlg();
</script>
<script>
if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {})); }
</script>
